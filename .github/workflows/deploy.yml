name: Deploy

# CI (testlar + build) master'da muvaffaqiyatli o'tgach, serverga SSH orqali
# kirib deploy.sh ni ishga tushiradi. Image'lar serverning o'zida yig'iladi
# (GHCR shart emas — server repo'ni read-only deploy key bilan tortadi).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: bash /opt/kutubxona/infra/scripts/deploy.sh
